name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Gate the deploy. Without this, a syntax error in app.js ships a blank app to
  # production, since every push to main deploys unconditionally.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Syntax-check app.js
        run: node --check app.js

      - name: Syntax-check sw.js
        run: node --check sw.js

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # v5 pulls in upload-artifact@v7. Note upload-pages-artifact@v4 stopped including
      # dotfiles in the artifact: that is fine here and mildly desirable — nothing the site
      # serves is a dotfile, and it stops `.gitignore` being published. If a dotfile ever is
      # needed (a `.well-known/` path, say), this action takes `include-hidden-files`.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
